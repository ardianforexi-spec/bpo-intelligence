[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bpo-intelligence-api"
version = "0.1.0"
description = "BPO Intelligence API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.36,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
